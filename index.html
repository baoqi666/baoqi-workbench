<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#7fb8f5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="喵の工作台" />
<title>喵の工作台 · 生活学习一体化</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
<link rel="apple-touch-icon" href="assets/icons/icon.svg" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="phone" id="phone">

 <!-- ========== 全局底图（最底层，位于所有界面之下） ========== -->
 <div id="wallpaper"></div>
 <div id="wallScrim"></div>

 <!-- ========== 开屏启动页 ========== -->
 <section class="splash" id="splash">
  <div class="splash-bg"></div>
  <div class="splash-inner">
   <div class="splash-hi" id="splashHi">嗨，朋友</div>
   <div class="splash-date">
    <div class="s-date" id="splashDate">--</div>
    <div class="s-week"><span id="splashWeek">--</span><i class="dot"></i><span id="splashTime">--:--</span></div>
   </div>

   <div class="splash-cat" id="splashCat"></div>

   <div class="quote-card" id="quoteCard">
    <div class="quote-mark">"</div>
    <p class="quote-text" id="quoteText">加载中…</p>
    <div class="quote-foot">
     <span class="quote-author" id="quoteAuthor"></span>
     <button class="quote-refresh" id="quoteRefresh" type="button">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 006.3 5.7L3 9"/><path d="M4 13a8 8 0 0013.7 5.3L21 15"/><path d="M3 4v5h5M21 20v-5h-5"/></svg>
      换一条
     </button>
    </div>
   </div>

   <div class="quote-card" id="splashInfo" style="padding:14px 16px 12px">
    <div style="display:flex;gap:12px;align-items:flex-start">
     <div class="grow">
      <div style="font-size:11.5px;color:var(--ink-3);font-weight:700">长沙市开福区 · 天气</div>
      <div id="weatherText" style="font-size:15px;font-weight:700;color:var(--ink);margin-top:3px;line-height:1.4">加载中…</div>
     </div>
    </div>
    <div style="height:1px;background:var(--line);margin:11px 0"></div>
    <div style="display:flex;gap:12px;align-items:flex-start">
     <div class="grow">
      <div style="font-size:11.5px;color:var(--ink-3);font-weight:700">今天去哪儿 · 出门</div>
      <div id="placeText" style="font-size:15px;font-weight:700;color:var(--ink);margin-top:3px">—</div>
      <div id="placeTip" style="font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.55"></div>
     </div>
    </div>
   </div>

   <button class="enter-btn" id="enterBtn" type="button">
    <span>开始今天</span>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
   </button>
   <div class="enter-tip">轻触任意处也可进入</div>
  </div>
 </section>

 <!-- ========== 主应用 ========== -->
 <div class="app" id="app" hidden>
  <header class="topbar">
   <button class="icon-btn" id="menuBtn" type="button" aria-label="菜单">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h16"/></svg>
   </button>
   <div class="topbar-title">
    <h1 id="pageTitle">首页</h1>
    <p id="pageSub">今天也要元气满满</p>
   </div>
   <div class="topbar-right" id="topbarRight"></div>
  </header>

  <main class="view" id="view"></main>

  <!-- 悬浮迷你计时器 -->
  <button class="mini-timer" id="miniTimer" type="button" hidden>
   <svg class="mt-ring" viewBox="0 0 44 44" width="44" height="44">
    <circle cx="22" cy="22" r="19" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="4"></circle>
    <circle id="mtProgress" cx="22" cy="22" r="19" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="119.4" stroke-dashoffset="0" transform="rotate(-90 22 22)"></circle>
   </svg>
   <span class="mt-text" id="mtText">25:00</span>
  </button>
 </div>

 <!-- ========== 侧滑抽屉 ========== -->
 <div class="drawer-mask" id="drawerMask"></div>
 <nav class="drawer" id="drawer">
  <div class="drawer-head">
   <div class="avatar" id="drawerAvatar"></div>
   <div class="drawer-meta">
    <strong id="drawerName">喵の工作台</strong>
    <span id="drawerStreak">连续打卡 0 天</span>
   </div>
   <button class="icon-btn ghost" id="drawerClose" type="button" aria-label="收起">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
   </button>
  </div>
  <div class="drawer-energy">
   <div class="de-row"><span>今日剩余精力</span><b id="drawerEnergy">100</b></div>
   <div class="bar"><i id="drawerEnergyBar" style="width:100%"></i></div>
  </div>
  <ul class="nav-list" id="navList"></ul>
  <div class="drawer-foot">
   <button class="tpl-share" id="shareTplBtn" type="button">分享同款模板</button>
   <button class="link-btn" id="wallpaperBtn" type="button">更换全局底图</button>
   <button class="link-btn" id="installHintBtn" type="button">安装到主屏</button>
   <div class="foot-row">
    <button class="link-btn" id="exportBtn" type="button">导出</button>
    <button class="link-btn" id="importBtn" type="button">导入</button>
   </div>
   <button class="link-btn" id="exportTxtBtn" type="button">导出为文本</button>
   <button class="link-btn danger" id="resetBtn" type="button">清空数据</button>
   <span class="ver">本地存储 · 你的独立模板</span>
   <input type="file" id="importFile" accept="application/json,.json" hidden />
   <input type="file" id="wallpaperFile" accept="image/*" hidden />
  </div>
 </nav>

 <!-- 安装到主屏引导横幅 -->
 <div class="install-bar" id="installBar" hidden>
  <div class="ib-ic">＋</div>
  <div class="ib-text">
   <strong>添加到主屏幕</strong>
   <span>像 App 一样从桌面打开，离线也能用</span>
  </div>
  <button class="ib-btn" id="installBtn" type="button">安装</button>
  <button class="ib-x" id="installClose" type="button" aria-label="关闭">✕</button>
 </div>

 <!-- 弹层 / 提示 -->
 <div class="modal-root" id="modalRoot"></div>
 <div class="toast" id="toast"></div>
</div>

<script src="assets/js/quotes.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/content/pushes.js"></script>
<script src="assets/js/content/reward-suggestions.js"></script>
<script src="assets/js/push.js"></script>
 <script src="assets/js/ui.js"></script>
 <script src="assets/js/timer.js"></script>
<script src="assets/js/pages/home.js"></script>
<script src="assets/js/pages/plan.js"></script>
<script src="assets/js/pages/ideas.js"></script>
<script src="assets/js/pages/health.js"></script>
<script src="assets/js/pages/fitness.js"></script>
<script src="assets/js/pages/review.js"></script>
<script src="assets/js/pages/weeksum.js"></script>
<script src="assets/js/pages/express.js"></script>
<script src="assets/js/pages/dream.js"></script>
<script src="assets/js/pages/reward.js"></script>
<script src="assets/js/app.js"></script>
<script>
/* 版本探测：发现线上版本变化自动重载，解决客户端缓存导致界面不更新 */
(function () {
 try {
  var KEY = 'catdesk_build', SKEY = 'catdesk_reloaded';
  fetch('version.json?_=' + Date.now(), { cache: 'no-store' })
   .then(function (r) { return r.json(); })
   .then(function (remote) {
    if (!remote || !remote.build) return;
    var local = localStorage.getItem(KEY);
    if (local !== remote.build) {
     localStorage.setItem(KEY, remote.build);
     if (!sessionStorage.getItem(SKEY)) {
      sessionStorage.setItem(SKEY, '1');
      location.reload(true);
     }
    }
   }).catch(function () {});
 } catch (e) {}
})();
</script>
</body>
</html>
